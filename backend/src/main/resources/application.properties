spring.application.name=nct-cinema-backend
spring.config.import=optional:file:./.env[.properties]
spring.profiles.default=mysql
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=2h
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=false
app.seed=${NCT_SEED:false}
app.admin.email=${NCT_ADMIN_EMAIL:}
app.admin.password=${NCT_ADMIN_PASSWORD:}